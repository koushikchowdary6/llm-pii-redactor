name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: PYTHONPATH=src python -m pytest tests/ -v
      - name: Demo redaction
        run: echo "email a@b.com key AKIAIOSFODNN7EXAMPLE" | PYTHONPATH=src python src/redactor.py --report
